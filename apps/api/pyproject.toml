[project]
name = "intelliai-api"
version = "0.2.0"
description = "IntelliAI API gateway and control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24",
    "asyncpg>=0.29",
    "redis>=5",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.18",
    "intelliai-runtime-contract",
]

[tool.uv.sources]
intelliai-runtime-contract = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_api"]
