[project]
name = "intelliai-runtime-contract"
version = "0.3.0"
description = "The permanent language between the API gateway and every AI runtime"
requires-python = ">=3.12"
# The contract's only runtime dependency, by design (ADR-0016). Adding a
# second dependency to this list is an architectural event, not a chore.
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_runtime_contract"]
