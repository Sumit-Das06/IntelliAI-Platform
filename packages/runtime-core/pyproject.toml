[project]
name = "intelliai-runtime-core"
version = "0.1.0"
description = "Shared lifecycle machinery for every IntelliAI runtime - lifecycle, never inference"
requires-python = ">=3.12"
# Lifecycle dependencies only (ADR-0019): httpx is the ArtifactStore's
# download transport, structlog the logging standard, and the contract
# supplies the error vocabulary. NO foundation-model library, NO server
# framework, NO capability schema may ever appear here — the boundary
# test suite enforces it.
dependencies = [
    "httpx>=0.27",
    "structlog>=24",
    "intelliai-runtime-contract",
]

[tool.uv.sources]
intelliai-runtime-contract = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_runtime_core"]
