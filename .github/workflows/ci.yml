# IntelliAI CI — answers one question on every push and PR:
# "Can a completely clean machine build, verify, and test this repository?"
#
# Modular jobs (lint / typecheck / test) run in parallel after a cheap
# change-detection job; docs-only changes skip them all. Future jobs
# (docker build, security scan, SBOM, license audit, OpenAPI validation,
# benchmarks) append below without restructuring — each follows the same
# shape: needs: changes → if: relevant filter → steps.
# "CI OK" aggregates everything into the single status check that branch
# protection will require.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger for runner-infrastructure hiccups (a job abandoned
  # by GitHub's own runners should not need an empty commit to retry).
  workflow_dispatch:

# Least-privilege token for every run. Dependabot-triggered workflows get a
# token stripped to contents:read unless permissions are declared explicitly;
# paths-filter needs pull-requests:read to list a PR's changed files.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes the running check

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      android: ${{ steps.filter.outputs.android }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'apps/**'
              - 'packages/**'
              - 'services/**'
              - 'ml/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            android:
              - 'apps/keyboard-android/**'
              - '.github/workflows/**'
            deploy:
              - 'infra/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.env.prod.example'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intelliai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: intelliai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U intelliai -d intelliai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Admission control is Redis-backed, and its guarantee IS the
      # atomicity of Lua scripts — a fake would prove only that the
      # Python around them reads well. Without this service the limiter
      # correctly fails open, and every limit test silently passes
      # nothing.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Clean-machine configuration: no .env file exists here by design —
      # the same channel production uses (real environment variables).
      INTELLIAI_ENV: test
      INTELLIAI_AUTH_KEY_PEPPER: ci-only-pepper
      INTELLIAI_DATABASE_URL: postgresql+asyncpg://intelliai:ci-only-password@localhost:5432/intelliai
      INTELLIAI_REDIS_URL: redis://127.0.0.1:6379/0
      INTELLIAI_STORAGE_ENDPOINT_URL: http://localhost:9000
      INTELLIAI_STORAGE_ACCESS_KEY: ci
      INTELLIAI_STORAGE_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg (stt-runtime media pipeline dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Apply migrations to a pristine database
        run: uv run --package intelliai-api alembic -c apps/api/alembic.ini upgrade head
      - name: Run tests
        run: uv run --package intelliai-api pytest apps/api/tests -q
      - name: Run datasets package tests
        run: uv run --package intelliai-datasets pytest ml/datasets/tests -q
      - name: Run evaluation package tests
        run: uv run --package intelliai-evaluation pytest ml/evaluation/tests -q
      - name: Run training package tests (torch-free layers; the train extra is never installed in CI)
        run: uv run --package intelliai-training pytest ml/training/tests -q
      - name: Run runtime-contract tests
        run: uv run --package intelliai-runtime-contract pytest packages/runtime-contract/tests -q
      - name: Run runtime-core tests (includes lifecycle-boundary enforcement)
        run: uv run --package intelliai-runtime-core pytest packages/runtime-core/tests -q
      - name: Run stt-runtime tests (includes engine-isolation enforcement)
        run: uv run --package intelliai-stt-runtime pytest services/stt-runtime/tests -q
      - name: Run tts-runtime tests (includes engine-isolation and license-boundary enforcement)
        run: uv run --package intelliai-tts-runtime pytest services/tts-runtime/tests -q

  android:
    # The IntelliAI Keyboard (apps/keyboard-android) — a self-contained
    # Gradle project, not a uv workspace member. Unit tests (debug AND
    # release variants) + lint on both variants + both APKs on every
    # keyboard change, so a release-only regression can never land
    # unnoticed. The release APK is UNSIGNED (no keystore in CI — ever);
    # signing is a local, deliberate act documented in the app README.
    name: Android Keyboard
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/keyboard-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew --no-daemon test lintDebug lintRelease assembleDebug assembleRelease
      - name: Keep the debug APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: intelliai-keyboard-debug-apk
          path: apps/keyboard-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Keep the unsigned release APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: intelliai-keyboard-release-unsigned-apk
          path: apps/keyboard-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

  deployment-config:
    # Milestone 20: production readiness must be checkable WITHOUT a
    # deployment. Validates the exact artifacts an operator will trust on
    # the VPS: the prod compose overlay resolves with dummy (never real)
    # secrets, the Caddyfile parses, and the production stt-runtime image
    # BUILDS — which re-verifies the pinned llama.cpp layer's checksums
    # and catches base-image bumps (e.g. Dependabot) that would otherwise
    # merge unbuilt. CI never deploys; there is nothing here to deploy to.
    name: Deployment Config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values so `compose config` can resolve required variables.
      # Deliberately shaped like placeholders — never real secrets.
      DOMAIN: ci.invalid
      INTELLIAI_AUTH_KEY_PEPPER: ci-only-dummy-pepper-value
      POSTGRES_PASSWORD: ci-only-dummy-password
      MINIO_ROOT_PASSWORD: ci-only-dummy-password
    steps:
      - uses: actions/checkout@v7
      - name: Validate the production compose configuration
        run: docker compose -f docker-compose.yml -f infra/compose/prod.yml config -q
      - name: Validate the local-staging overlay too (it must stay loadable)
        run: docker compose -f docker-compose.yml -f infra/compose/local-staging.yml config -q
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN="$DOMAIN" \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build the production stt-runtime image (verifies the pinned llama.cpp layer)
        run: docker build -f infra/docker/stt-runtime.Dockerfile -t intelliai-stt-runtime:ci .
      - name: Build the production api image
        run: docker build -f infra/docker/api.Dockerfile -t intelliai-api:ci .
      - name: The built runtime image must carry the pinned llama-server
        run: |
          docker run --rm --entrypoint sh intelliai-stt-runtime:ci -c \
            'sha256sum /opt/llama-cpp/llama-server' | tee hash.txt
          grep -q '9b7b699e2e9579184117834aeaef34d5cc711027fbbc67a2a38d66559c4f288e' hash.txt

  ci-ok:
    # The one status check to rule them all: branch protection requires
    # THIS job, so adding/removing upstream jobs never breaks merge rules.
    # skipped upstream (docs-only change) counts as success.
    name: CI OK
    needs: [changes, lint, typecheck, test, android, deployment-config]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        run: |
          for result in "${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.android.result }}" "${{ needs.deployment-config.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job failed: $result"
              exit 1
            fi
          done
          echo "All green."
