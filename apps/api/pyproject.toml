[project]
name = "intelliai-api"
version = "0.1.0"
description = "IntelliAI API gateway and control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24",
    "asyncpg>=0.29",
    "redis>=5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_api"]
