[project]
name = "intelliai-tts-runtime"
version = "0.2.0"
description = "IntelliAI speech synthesis runtime - capability-named, engine-swappable"
requires-python = ">=3.12"
# NO foundation-model library, phonemizer, or voice asset may appear here.
# Engine libraries live in optional extras owned by engines/ modules (the
# kokoro extra arrives with the Kokoro engine); the isolation test suite
# enforces this boundary. Note: no python-multipart — this runtime's
# binding is JSON in, binary audio out (ADR-0020), the mirror of STT.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24",
    "intelliai-runtime-contract",
    "intelliai-runtime-core",
]

[project.optional-dependencies]
# One extra per engine family; installed where that engine actually runs
# (dev machines, inference deployments) — never in CI, never implicitly.
# torch is declared explicitly so the CPU wheel index below can bind to
# it: on Linux, PyPI's torch is the CUDA build (gigabytes of nvidia
# wheels) — CPU-first deployment (ADR-0015) means the deployment image
# carries the CPU build; GPU arrives as a build-arg/overlay, never by
# default.
kokoro = [
    "kokoro>=0.9.4",
    "torch>=2",
    # misaki's English G2P needs this spaCy model and will otherwise
    # PIP-INSTALL IT FROM THE INTERNET AT MODEL LOAD (found by production
    # validation: the hardened image has no installer, so startup failed).
    # Pinned here as an explicit URL dependency instead — no runtime
    # fetches, ever; the lockfile records the wheel's hash.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv.sources]
intelliai-runtime-contract = { workspace = true }
intelliai-runtime-core = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Permits the pinned spaCy-model wheel URL in the kokoro extra.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_tts_runtime"]
