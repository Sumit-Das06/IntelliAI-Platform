[project]
name = "intelliai-stt-runtime"
version = "0.1.0"
description = "IntelliAI transcription runtime - capability-named, engine-swappable"
requires-python = ">=3.12"
# NO foundation-model library may appear here. Engine libraries live in
# optional extras owned by engines/ modules; the isolation test suite
# enforces this boundary. httpx is the ArtifactStore's download transport,
# not a model library.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    # The realtime session core (realtime.py, NOT an engine) works on
    # PCM frames as arrays; numpy is generic numerics, not a model lib.
    "numpy>=1.26",
    "intelliai-runtime-contract",
    "intelliai-runtime-core",
]

[project.optional-dependencies]
# One extra per engine family; installed where that engine actually runs
# (dev machines, inference deployments) — never in CI, never implicitly.
whisper = [
    "faster-whisper>=1.1",
]
# GPU serving for the realtime feature (M53): the CUDA 12 runtime DLLs
# CT2 links against, as wheels, so a GPU deployment is one extra rather
# than a hand-installed toolkit. Windows-only markers today because the
# staging GPU host is Windows; Linux GPU serving adds its own markers.
cuda = [
    "nvidia-cublas-cu12>=12.6; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.10; sys_platform == 'win32'",
]
punctuation = [
    "onnxruntime>=1.28",
    "sentencepiece>=0.2",
]

[tool.uv.sources]
intelliai-runtime-contract = { workspace = true }
intelliai-runtime-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_stt_runtime"]
