# Alembic configuration for the platform database (system of record).
# Run via the repo-root Makefile: `make migrate`, `make migration m="..."`.
# The database URL is NOT stored here — env.py reads it from validated
# application settings, so migrations and the app can never disagree.

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
