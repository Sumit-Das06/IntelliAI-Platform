# Overlay: one capability, two deployments.
#
#   docker compose -f docker-compose.yml -f infra/compose/multilingual.yml up
#
# The base file's topology is the degenerate case of ADR-0026 — one
# deployment per capability, carrying the service's own name. This overlay
# adds a second transcription deployment and tells the gateway where it
# lives. Nothing else changes: the registry decides which route uses it,
# and a route naming a deployment the gateway has no URL for is an
# operations error rather than a customer's problem.
#
# The name follows ADR-0026's naming law — capabilities and languages
# only, never engines. `stt-runtime-indic` is lawful because languages are
# promises kept regardless of what serves them; the gateway refuses an
# engine-named deployment at startup.
#
# Default posture is ONE ARTIFACT PER DEPLOYMENT on CPU (F-M5-5): each
# resident speech engine is GiB-scale, and packing buys back roughly one
# interpreter (~50 MiB) at the cost of a shared worker pool and a shared
# blast radius. See docs/benchmarks/2026-08-05-deployment-topology.md.

services:
  api:
    environment:
      # The deployment → URL map. The two capability defaults come from
      # the base file; this names the extra ones.
      INTELLIAI_RUNTIMES_DEPLOYMENTS: stt-runtime-indic=http://stt-runtime-indic:8001

  stt-runtime-indic:
    build:
      context: .
      dockerfile: infra/docker/stt-runtime.Dockerfile
    environment:
      # A second deployment of the SAME capability service, hosting a
      # different artifact. The reference engine stands in for a future
      # language specialist here: multi-deployment topology is proven by
      # the architecture, not by the models.
      INTELLIAI_STT_SLOTS: ${INTELLIAI_STT_INDIC_SLOTS:-reference:future-hi-v1}
      INTELLIAI_STT_LOG_LEVEL: ${INTELLIAI_STT_LOG_LEVEL:-INFO}
    volumes:
      # The shared, hash-verified model cache serves any number of
      # deployments; artifacts are namespaced by id.
      - modelcache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    networks: [intelliai]
    restart: unless-stopped
