# Production overlay: HTTPS in front, the same stack behind.
#   docker compose -f docker-compose.yml -f infra/compose/prod.yml up -d --build
# (make prod-up)
#
# The base file is already production-shaped: every stateful port binds to
# 127.0.0.1 only, every service restarts unless stopped, healthchecks
# gate startup. This overlay adds exactly one thing the internet needs —
# Caddy terminating TLS on 80/443 — and pins the production posture
# (INTELLIAI_ENV=prod, whisper slots explicit). Nothing else changes shape,
# which is the point: dev and prod run the same system.

services:
  caddy:
    # Automatic HTTPS: with a real DOMAIN and DNS pointing here, Caddy
    # obtains and renews Let's Encrypt certificates on its own. With
    # DOMAIN=localhost it issues an internal self-signed cert — which is
    # how the from-scratch verification runs without a domain.
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. api.yourdomain.com)}
    volumes:
      # Relative paths in overlays resolve against the PROJECT directory
      # (where docker-compose.yml lives), not this file's directory —
      # found the hard way by the from-scratch verification.
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data      # certificates — must survive restarts
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_started
    networks: [intelliai]
    healthcheck:
      # The admin endpoint answers only when the config loaded and the
      # server is actually serving — a cert-issuance crash-loop stops
      # looking "up" (M31; the smoke script also checks this state).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    environment:
      INTELLIAI_ENV: prod
      # M42: this deployment SERVES speech synthesis, so the gateway
      # answers for it in readiness — green means every service this
      # deployment runs is actually up (no false green, no permanent
      # meaningless DEGRADED).
      INTELLIAI_RUNTIMES_TTS_ENABLED: "true"

  stt-runtime:
    environment:
      # Explicit in prod, never inherited from a stray dev variable: this
      # deployment hosts the incumbent AND the promoted Hindi specialist
      # (M26 founder decision — the catalog routes hi to E3). The E3
      # weights are distributed by SEEDING into the model volume
      # (hash-verified at load); the preflight refuses a prod start
      # without them.
      INTELLIAI_STT_SLOTS: whisper,qwen3-asr:qwen3-asr-0.6b-hi-ft-e3
      # M30: the Hindi punctuation stage is IMPLEMENTED but production
      # stays OFF until its own promotion decision passes the full gate
      # battery — explicit here so a stray dev variable can never enable
      # a stage this deployment has not approved.
      INTELLIAI_STT_PUNCTUATION_ENABLED: "false"
      # M50: the English punctuation stage is IMPLEMENTED but production
      # stays OFF until its own promotion decision — explicit here so a
      # stray dev variable can never enable a stage this deployment has
      # not approved.
      INTELLIAI_STT_PUNCTUATION_EN_ENABLED: "false"

  # ── Speech synthesis (M42 promotion, founder decision F-M42) ──────────
  # TTS is an APPROVED production service: English (M3→M37) and Hindi
  # (M38→M40) on one Kokoro-82M artifact. The posture is explicit here,
  # never inherited from a stray dev variable, and mirrors exactly what
  # the production-shaped local stack validated:
  #   slots kokoro          — one hosted artifact, hash-verified at load
  #   normalize_text true   — the M35/M39 speech-only normalization seam
  #   oov_fallback espeak   — English OOV rescue at the exec boundary
  #   hindi_g2p espeak      — Hindi G2P + the two approved Hindi voices
  # The voice packs ship inside the pinned artifact; `make seed-models`
  # places them (models/kokoro-82m/v2/) and the preflight refuses a prod
  # start without them, so a box with no egress never silently degrades.
  # NOTE: promotion is repository posture. Bringing this service UP on a
  # real host is the separate deployment/launch milestone.
  tts-runtime:
    environment:
      INTELLIAI_TTS_SLOTS: kokoro
      INTELLIAI_TTS_NORMALIZE_TEXT: "true"
      INTELLIAI_TTS_OOV_FALLBACK: espeak
      INTELLIAI_TTS_HINDI_G2P: espeak

volumes:
  caddydata:
  caddyconfig:
