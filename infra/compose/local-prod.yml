# LOCAL PRODUCTION-SHAPED overlay — the M25 tunnel-testable E3 stack.
#
# The EXACT production architecture (base stack + the prod overlay's
# Caddy HTTPS edge), runnable locally without production credentials.
# Since the M26 promotion the live catalog itself routes
# hi -> qwen3-asr-0.6b-hi-ft-e3, so this overlay serves the SAME routes
# production would; the staging registry profile stays declared as the
# hook where the NEXT promotion candidate will compose first. This file
# is NEVER applied implicitly: it activates only by hand
# (`make local-prod-up`); the settings layer refuses the staging
# profile under INTELLIAI_ENV=prod, and no prod-* Make target
# references this file (guard-tested).
#
# Cloudflare Tunnel points at the Caddy edge (https://localhost) so
# Web and Android exercise the same HTTPS path a future Hostinger
# deployment serves: docs/ops/local-tunnel.md.

services:
  caddy:
    # Same edge as production (infra/compose/prod.yml): TLS, security
    # headers, 30MB body ceiling. DOMAIN=localhost issues Caddy's
    # internal self-signed certificate; the tunnel gives clients a real
    # Cloudflare certificate on the outside.
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_started
    networks: [intelliai]
    healthcheck:
      # The admin endpoint answers only when the config loaded and the
      # server is actually serving — a cert-issuance crash-loop stops
      # looking "up" (M31; the smoke script also checks this state).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    environment:
      # dev env + staging profile: the ONLY composition that can serve a
      # pending proposal (prod refuses it). With none pending after the
      # M42 promotion it composes exactly the live catalog. Everything
      # else about the stack keeps the production posture.
      INTELLIAI_REGISTRY_PROFILE: staging
      # This stack starts tts-runtime (--profile tts), so the gateway
      # answers for it in readiness — same law as production (M42).
      INTELLIAI_RUNTIMES_TTS_ENABLED: "true"

  stt-runtime:
    environment:
      INTELLIAI_STT_SLOTS: whisper,qwen3-asr:qwen3-asr-0.6b-hi-ft-e3
      # M30 staging battery: the punctuation stage runs here (and only
      # here) so the production-shaped stack can prove it end to end
      # before any production enable is even proposed.
      INTELLIAI_STT_PUNCTUATION_ENABLED: "true"
      INTELLIAI_STT_PUNCTUATION_LANGUAGES: hi,hi-IN

  tts-runtime:
    # M35: served in the production-shaped LOCAL stack (the Makefile's
    # `--profile tts` lifts the base gate for THIS stack only — prod.yml
    # still ships no TTS service). Hardened posture pinned explicitly:
    # normalization on, espeak OOV fallback on through the exec boundary.
    environment:
      INTELLIAI_TTS_SLOTS: kokoro
      INTELLIAI_TTS_NORMALIZE_TEXT: "true"
      INTELLIAI_TTS_OOV_FALLBACK: espeak
      # M39 staging shape: Hindi voices + G2P declared here; prod.yml
      # remains untouched (production ships no TTS at all).
      INTELLIAI_TTS_HINDI_G2P: espeak

volumes:
  caddydata:
  caddyconfig:
