# ── PREPARED, NOT ENABLED — realtime STT production overlay (M54) ────────
#
# This file is the REVIEWED production configuration for realtime STT.
# It is NOT referenced by any deploy command: enabling realtime in
# production means a founder-gated promotion milestone deliberately
# adding `-f infra/compose/prod-realtime.yml` to the production compose
# invocation. prod.yml keeps the URL pinned empty; an ops guard test
# pins both facts.
#
# Architecture (the staging-proven M53/M54 shape):
#   * The gateway bridges wss → a REALTIME RUNTIME reachable at the URL
#     below. The runtime is a GPU host service (like staging), started
#     by the operator with `make realtime-qwen` + `make realtime-stt`
#     (pinned launcher refuses binary drift; startup warm-up decode and
#     backend probe make a broken GPU fail the deploy, not a customer).
#   * Resource budget and minimum GPU class: see
#     docs/milestones/54-realtime-stt-hardening.md (GPU production
#     decision) before sizing the box.
#
# Rollback drill (proven in M53 and re-proven in M54): emptying the URL
# below and restarting the api container closes the WebSocket surface
# pre-accept; batch STT continues untouched.

services:
  api:
    environment:
      # The single production ON switch for realtime STT.
      INTELLIAI_RUNTIMES_STT_REALTIME_WS_URL: ws://host.docker.internal:8003/v1/realtime

  # M55: Hindi BATCH through GPU serving — measured to ELIMINATE the CPU
  # service-path instability (research/experiments/55-production-gpu-readiness/
  # evidence/hi-batch.json: 117 words x5 byte-deterministic where the CPU
  # path scattered 2-94). The batch engine rides its OWN pinned GPU
  # llama-server instance (port 8798) so batch can never starve realtime
  # sessions (:8797). Launch both with tools/realtime/launch_qwen_gpu.py.
  stt-runtime:
    environment:
      INTELLIAI_STT_QWEN3_SERVER_URL: http://host.docker.internal:8798

# Ops note: run `tools/ops/realtime_alerts.py --log <runtime log>
# --ready-url http://127.0.0.1:8003/health/ready` on a 1-minute schedule
# on the GPU host — thresholds and fire-proof in the M55 evidence.
