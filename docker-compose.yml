name: intelliai

# Base compose file: local development infrastructure.
# Overlays live in infra/compose/ (gpu, prod) and are applied with
#   docker compose -f docker-compose.yml -f infra/compose/<overlay>.yml up
# Stateful ports bind to 127.0.0.1 only — nothing here is reachable from the LAN.

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      INTELLIAI_ENV: ${INTELLIAI_ENV:-dev}
      INTELLIAI_LOG_LEVEL: ${INTELLIAI_LOG_LEVEL:-INFO}
      INTELLIAI_AUTH_KEY_PEPPER: ${INTELLIAI_AUTH_KEY_PEPPER:?set in .env}
      # In-network addresses: containers reach siblings by SERVICE NAME via
      # Docker DNS — never localhost, which inside a container means itself.
      INTELLIAI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intelliai}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-intelliai}
      INTELLIAI_REDIS_URL: redis://redis:6379/0
      INTELLIAI_STORAGE_ENDPOINT_URL: http://minio:9000
      INTELLIAI_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-intelliai}
      INTELLIAI_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      INTELLIAI_RUNTIMES_STT_URL: http://stt-runtime:8001
      INTELLIAI_RUNTIMES_TTS_URL: http://tts-runtime:8002
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Liveness only: readiness is the router's/monitor's question, and a
      # down dependency must NOT make Docker restart a healthy api process.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [intelliai]
    restart: unless-stopped

  stt-runtime:
    build:
      context: .
      dockerfile: infra/docker/stt-runtime.Dockerfile
    environment:
      # The artifacts this deployment hosts, in order; the first takes the
      # `default` slot. One entry today — the degenerate case of a plural
      # topology (ADR-0026).
      INTELLIAI_STT_SLOTS: ${INTELLIAI_STT_SLOTS:-whisper}
      INTELLIAI_STT_LOG_LEVEL: ${INTELLIAI_STT_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Hash-verified model cache: survives restarts and image rebuilds;
      # first boot downloads (~480 MB), every boot re-verifies.
      - modelcache:/models
    healthcheck:
      # Readiness IS the right probe here: this service has no downstream
      # dependencies, and ready means "models loaded and warm". The long
      # start_period covers the first-boot artifact download.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    networks: [intelliai]
    restart: unless-stopped

  tts-runtime:
    build:
      context: .
      dockerfile: infra/docker/tts-runtime.Dockerfile
    environment:
      # The artifacts this deployment hosts, in order; the first takes the
      # `default` slot. One env flip swaps the engine ("reference" serves
      # the same API with no model — the deployment-level
      # engine-independence seam) or adds a second hosted artifact.
      INTELLIAI_TTS_SLOTS: ${INTELLIAI_TTS_SLOTS:-kokoro}
      INTELLIAI_TTS_LOG_LEVEL: ${INTELLIAI_TTS_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      # Hash-verified model cache, shared with stt (artifacts are
      # namespaced by id): first boot downloads (~330 MB), every boot
      # re-verifies.
      - modelcache:/models
    healthcheck:
      # Readiness IS the right probe (no downstream dependencies; ready
      # means "model loaded and warm"). The long start_period covers the
      # first-boot artifact download.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
    networks: [intelliai]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelliai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-intelliai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intelliai} -d ${POSTGRES_DB:-intelliai}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [intelliai]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence so rate-limit/cache state survives dev restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [intelliai]
    restart: unless-stopped

  minio:
    # Dev-only S3 stand-in; production uses a managed S3-compatible store.
    # Pinned to the FINAL official upstream release (project archived 2026-04);
    # replaceable behind the S3 API — see ADR-0011.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intelliai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env — copy .env.example to .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [intelliai]
    restart: unless-stopped

  adminer:
    # Visual database browser, dev convenience only. Not started by default:
    #   make db-ui   (docker compose --profile tools up -d adminer)
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [intelliai]
    restart: unless-stopped

networks:
  intelliai:

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
