[project]
name = "intelliai-evaluation"
version = "0.1.0"
description = "Evaluation seed: versioned eval datasets, WER, and benchmark recording"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_evaluation"]
