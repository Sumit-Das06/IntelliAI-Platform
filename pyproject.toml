# Workspace root — not an installable package (tool.uv.package = false).
# Declares which directories are uv workspace members; all members resolve
# against the single uv.lock at this root. Members are listed explicitly,
# not globbed: adding a package to the workspace is a reviewed decision.

[project]
name = "intelliai"
version = "0.3.0"
description = "IntelliAI Platform workspace root"
requires-python = ">=3.12"

[dependency-groups]
# Workspace-wide engineering tooling. Application dependencies live in each
# member's own pyproject; this group is the standards machinery.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "ml/evaluation",
    "packages/runtime-contract",
    "packages/runtime-core",
    "services/stt-runtime",
    "services/tts-runtime",
]

# ── Lint & format: ruff (replaces black + isort + flake8 + friends) ─────
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "apps/api/src",
    "apps/api/tests",
    "ml/evaluation/src",
    "ml/evaluation/tests",
    "packages/runtime-contract/src",
    "packages/runtime-contract/tests",
    "packages/runtime-core/src",
    "packages/runtime-core/tests",
    "services/stt-runtime/src",
    "services/stt-runtime/tests",
    "services/tts-runtime/src",
    "services/tts-runtime/tests",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (real bugs: undefined names, unused imports)
    "I",        # import sorting
    "N",        # pep8 naming
    "UP",       # modernize to current Python idioms
    "B",        # bugbear: likely bugs and design problems
    "C4",       # comprehension quality
    "SIM",      # simplifiable code
    "S",        # security (bandit rules)
    "A",        # builtin shadowing
    "T20",      # no print() — the logging standard, enforced
    "RUF",      # ruff-native correctness rules
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",  # assert is the point of tests
    "S105", "S106",  # hardcoded fake credentials in test fixtures
    "S603", "S607",  # tests spawn fixture subprocesses (ffmpeg encodes): fixed argv, PATH lookup
]
"**/cli.py" = ["T201"]  # the CLI's job is printing to a human
"**/alembic/versions/*" = ["F401"]  # template imports kept for future revisions

# ── Types: mypy strict ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "apps/api/tests",
    "ml/evaluation/src",
    "ml/evaluation/tests",
    "packages/runtime-contract/src",
    "packages/runtime-contract/tests",
    "packages/runtime-core/src",
    "packages/runtime-core/tests",
    "services/stt-runtime/src",
    "services/stt-runtime/tests",
    "services/tts-runtime/src",
    "services/tts-runtime/tests",
]
# Escape hatch policy: targeted `# type: ignore[code]` with the error code,
# never a bare ignore — enforced by the two flags below.
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Engine libraries are optional extras: absent in CI (import-not-found),
# installed-but-untyped on inference machines (import-untyped). This scoped
# override is the one sanctioned exception to strict imports — engines only.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "numpy.*", "kokoro.*", "misaki.*", "torch.*"]
ignore_missing_imports = true
