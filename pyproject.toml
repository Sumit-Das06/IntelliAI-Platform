# Workspace root — not an installable package (tool.uv.package = false).
# Declares which directories are uv workspace members; all members resolve
# against the single uv.lock at this root. Members are listed explicitly,
# not globbed: adding a package to the workspace is a reviewed decision.

[project]
name = "intelliai"
version = "0.0.0"
description = "IntelliAI Platform workspace root"
requires-python = ">=3.12"

[dependency-groups]
# Workspace-wide engineering tooling. Application dependencies live in each
# member's own pyproject; this group is the standards machinery.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
]

# ── Lint & format: ruff (replaces black + isort + flake8 + friends) ─────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (real bugs: undefined names, unused imports)
    "I",        # import sorting
    "N",        # pep8 naming
    "UP",       # modernize to current Python idioms
    "B",        # bugbear: likely bugs and design problems
    "C4",       # comprehension quality
    "SIM",      # simplifiable code
    "S",        # security (bandit rules)
    "A",        # builtin shadowing
    "T20",      # no print() — the logging standard, enforced
    "RUF",      # ruff-native correctness rules
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",  # assert is the point of tests
    "S105", "S106",  # hardcoded fake credentials in test fixtures
]
"**/alembic/versions/*" = ["F401"]  # template imports kept for future revisions

# ── Types: mypy strict ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "apps/api/tests"]
# Escape hatch policy: targeted `# type: ignore[code]` with the error code,
# never a bare ignore — enforced by the two flags below.
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
