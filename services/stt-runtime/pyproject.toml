[project]
name = "intelliai-stt-runtime"
version = "0.1.0"
description = "IntelliAI transcription runtime - capability-named, engine-swappable"
requires-python = ">=3.12"
# NO foundation-model library may appear here. Engine libraries arrive as
# optional extras owned by engines/ (M2 step 5); the isolation test suite
# enforces this boundary.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "structlog>=24",
    "python-multipart>=0.0.18",
    "intelliai-runtime-contract",
]

[tool.uv.sources]
intelliai-runtime-contract = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliai_stt_runtime"]
